version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: cortex
    main: ./cmd/cortex
    binary: cortex
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - id: cortex
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # Keep release asset names version-independent so GitHub's
    # /releases/latest/download/... URLs always resolve to the newest build.
    name_template: "cortex-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  disable: true

release:
  github:
    owner: atakang7
    name: cortex
  draft: false
  prerelease: auto
  mode: append
