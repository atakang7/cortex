version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: synapse
    main: ./cmd/synapse
    binary: synapse
    env:
      - CGO_ENABLED=0
    # Windows is excluded: synapse depends on github.com/atakang7/axon/agent,
    # whose process-group shell tools are POSIX-only.
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - id: synapse
    name_template: "synapse_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  disable: true

release:
  github:
    owner: atakang7
    name: synapse
  draft: false
  prerelease: auto
  mode: append
