<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="t d">
<title id="t">How Cortex works</title><desc id="d">Three Cortex terminal scenes showing inspect-edit-verify, live model selection, and managed long-running processes.</desc>
<defs><style>
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}.h{font-family:system-ui,-apple-system,sans-serif}.w{fill:#EEF2FF}.a{fill:#A5B4FC}.u{fill:#67E8F9}.b{fill:#FDBA74}.t{fill:#7DD3FC}.o{fill:#86EFAC}.p{fill:#D8B4FE}.x{fill:#6B7280}.f{fill:#4B5563}.sm{font-size:16px}.md{font-size:19px}.lg{font-size:25px}.bold{font-weight:700}
</style></defs>
<rect width="1440" height="720" rx="28" fill="#0c0e13"/>
<text x="60" y="65" class="h w bold" font-size="34">Cortex stays in the terminal — and keeps the loop visible.</text>
<text x="60" y="98" class="h x" font-size="18">Real repository actions are rendered as compact tool cards, not hidden behind a spinner.</text>

<!-- card 1 -->
<g transform="translate(55 135)"><rect width="425" height="520" rx="18" fill="#15171d" stroke="#2b2f39"/><text x="24" y="38" class="m b bold sm">01 · INSPECT → EDIT → VERIFY</text>
<text x="24" y="82" class="m u bold md">❯ fix the failing session title test</text>
<text x="30" y="132" class="m t bold sm">▐ search</text><text x="130" y="132" class="m x sm">TitleModel</text><text x="30" y="158" class="m o sm">└ ✓ 8 lines</text>
<text x="30" y="202" class="m t bold sm">▐ read</text><text x="112" y="202" class="m x sm">loop.go</text><text x="30" y="228" class="m o sm">└ ✓ 74 lines</text>
<text x="30" y="272" class="m t bold sm">▐ write</text><text x="122" y="272" class="m x sm">loop.go · replace_string</text><text x="30" y="298" class="m o sm">└ ✓ ok</text>
<text x="30" y="342" class="m t bold sm">▐ exec</text><text x="112" y="342" class="m x sm">go test ./...</text><text x="30" y="368" class="m f sm">│ ok github.com/atakang7/cortex/internal/ui</text><text x="30" y="394" class="m o sm">└ ✓ tests green</text>
<text x="24" y="444" class="m a bold sm">Small change. Concrete proof. Stop.</text>
<rect x="22" y="466" width="381" height="34" rx="8" fill="#101217" stroke="#3b404b"/><text x="34" y="489" class="m b sm">❯</text><text x="58" y="489" class="m f sm">ask for a change</text></g>

<!-- card 2 -->
<g transform="translate(508 135)"><rect width="425" height="520" rx="18" fill="#15171d" stroke="#2b2f39"/><text x="24" y="38" class="m b bold sm">02 · SWITCH MODELS LIVE</text>
<text x="24" y="83" class="m a md">/model</text><text x="24" y="116" class="m x sm">Select model for this session</text>
<rect x="22" y="145" width="381" height="48" rx="8" fill="#20232b" stroke="#FDBA74"/><text x="40" y="175" class="m b bold sm">› z-ai/glm-5.2</text>
<text x="40" y="223" class="m w sm">deepseek/deepseek-v3.2</text><text x="40" y="263" class="m w sm">qwen/qwen3.6-flash</text><text x="40" y="303" class="m w sm">moonshotai/kimi-k2.5</text>
<line x1="22" y1="338" x2="403" y2="338" stroke="#2b2f39"/><text x="24" y="377" class="m p md">/pruner</text><text x="24" y="410" class="m x sm">Swap the cheap context curator independently.</text>
<text x="24" y="457" class="m f sm">model: z-ai/glm-5.2</text><text x="24" y="484" class="m p sm">pruner: deepseek/v4-flash</text></g>

<!-- card 3 -->
<g transform="translate(961 135)"><rect width="425" height="520" rx="18" fill="#15171d" stroke="#2b2f39"/><text x="24" y="38" class="m b bold sm">03 · MANAGE LONG-RUNNING WORK</text>
<text x="30" y="88" class="m t bold sm">▐ exec</text><text x="112" y="88" class="m x sm">npm run dev · background</text><text x="30" y="114" class="m o sm">└ ✓ shell_id bash_1</text>
<line x1="55" y1="138" x2="55" y2="180" stroke="#4B5563" stroke-width="2"/><text x="76" y="162" class="m f sm">edit while server stays alive</text>
<text x="30" y="212" class="m t bold sm">▐ write</text><text x="122" y="212" class="m x sm">src/app.ts</text><text x="30" y="238" class="m o sm">└ ✓ ok</text>
<text x="30" y="286" class="m t bold sm">▐ bash_output</text><text x="178" y="286" class="m x sm">bash_1</text><text x="30" y="312" class="m f sm">│ ready on http://localhost:3000</text><text x="30" y="338" class="m o sm">└ ✓ new output only</text>
<text x="30" y="386" class="m t bold sm">▐ kill_shell</text><text x="165" y="386" class="m x sm">bash_1</text><text x="30" y="412" class="m o sm">└ ✓ process group stopped</text>
<text x="24" y="462" class="m a bold sm">Spawn → inspect → change → verify → clean up.</text></g>
</svg>