<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Concrete Cortex behavior</title>
  <desc id="desc">Four panels show Cortex continuing through tools in one turn, reversible writes, managed background processes, and terminal-native output.</desc>
  <defs>
    <style>
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}
      .s{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .white{fill:#eef2ff}.muted{fill:#6b7280}.faint{fill:#4b5563}.brand{fill:#fdba74}.tool{fill:#7dd3fc}.ok{fill:#86efac}.assistant{fill:#a5b4fc}.user{fill:#67e8f9}.pruner{fill:#d8b4fe}
      .eyebrow{font-size:15px;font-weight:700;letter-spacing:1.2px}.h{font-size:27px;font-weight:700}.body{font-size:17px}.mono{font-size:16px}.tiny{font-size:14px}.bold{font-weight:700}
    </style>
  </defs>

  <rect width="1440" height="760" rx="28" fill="#0b0d12"/>
  <text x="58" y="58" class="s white h">The useful parts are not hidden behind “agentic”.</text>
  <text x="58" y="88" class="s muted body">These are concrete runtime behaviors Cortex exposes every time it works.</text>

  <!-- loop -->
  <g transform="translate(55 125)">
    <rect width="650" height="265" rx="18" fill="#15171d" stroke="#2b2f39"/>
    <text x="24" y="36" class="s brand eyebrow">01 · ONE TURN CAN ACTUALLY LOOP</text>
    <text x="24" y="70" class="s white h">Tool results change the next decision.</text>
    <text x="26" y="110" class="m user bold mono">❯ fix the failing greeting test</text>
    <text x="32" y="145" class="m tool bold mono">▐ search</text><text x="126" y="145" class="m muted mono">Greeting</text><text x="280" y="145" class="m faint mono">→ model sees matches</text>
    <text x="32" y="176" class="m tool bold mono">▐ read</text><text x="112" y="176" class="m muted mono">greeter.go</text><text x="280" y="176" class="m faint mono">→ model sees exact code</text>
    <text x="32" y="207" class="m tool bold mono">▐ write</text><text x="122" y="207" class="m muted mono">replace_string</text><text x="280" y="207" class="m faint mono">→ session records old bytes</text>
    <text x="32" y="238" class="m tool bold mono">▐ exec</text><text x="112" y="238" class="m muted mono">go test ./...</text><text x="280" y="238" class="m ok mono">→ exit 0 → final answer</text>
  </g>

  <!-- reversible -->
  <g transform="translate(735 125)">
    <rect width="650" height="265" rx="18" fill="#15171d" stroke="#2b2f39"/>
    <text x="24" y="36" class="s brand eyebrow">02 · EDITS HAVE A REAL UNDO PATH</text>
    <text x="24" y="70" class="s white h">Axon records what Cortex replaced.</text>
    <rect x="24" y="105" width="602" height="48" rx="9" fill="#101217" stroke="#343842"/>
    <text x="40" y="135" class="m tool bold mono">write</text><text x="100" y="135" class="m muted mono">greeter.go · replace_string</text><text x="500" y="135" class="m ok mono">✓ ok</text>
    <text x="46" y="180" class="m faint mono">old bytes</text><text x="158" y="180" class="m faint mono">──────────────→</text><text x="310" y="180" class="m assistant mono">edit record</text><text x="425" y="180" class="m faint mono">────────→</text><text x="520" y="180" class="m white mono">new file</text>
    <text x="46" y="220" class="m brand bold mono">/undo</text><text x="112" y="220" class="m muted mono">restores the previous bytes; it is not “ask the model to undo it”.</text>
  </g>

  <!-- process -->
  <g transform="translate(55 420)">
    <rect width="650" height="280" rx="18" fill="#15171d" stroke="#2b2f39"/>
    <text x="24" y="36" class="s brand eyebrow">03 · LONG-RUNNING COMMANDS BECOME STATE</text>
    <text x="24" y="70" class="s white h">A server does not have to block the turn.</text>
    <text x="30" y="112" class="m tool bold mono">▐ exec</text><text x="112" y="112" class="m muted mono">npm run dev · background</text><text x="30" y="140" class="m ok mono">└ ✓ shell_id bash_1</text>
    <text x="52" y="178" class="m faint mono">edit code while bash_1 keeps running</text>
    <text x="30" y="214" class="m tool bold mono">▐ bash_output</text><text x="174" y="214" class="m muted mono">bash_1</text><text x="267" y="214" class="m faint mono">only bytes since last poll</text>
    <text x="30" y="248" class="m tool bold mono">▐ kill_shell</text><text x="164" y="248" class="m muted mono">bash_1</text><text x="267" y="248" class="m ok mono">TERM → grace → KILL</text>
  </g>

  <!-- terminal -->
  <g transform="translate(735 420)">
    <rect width="650" height="280" rx="18" fill="#15171d" stroke="#2b2f39"/>
    <text x="24" y="36" class="s brand eyebrow">04 · THE UI DOES NOT OWN YOUR TERMINAL</text>
    <text x="24" y="70" class="s white h">Finished work is normal scrollback.</text>
    <text x="30" y="116" class="m assistant mono">Both tests pass. Changed only greeter.go.</text>
    <text x="30" y="149" class="m faint mono">↑ searchable · selectable · copyable after Cortex exits</text>
    <rect x="24" y="176" width="602" height="42" rx="8" fill="#101217" stroke="#4b5563"/>
    <text x="40" y="203" class="m brand bold mono">❯</text><text x="68" y="203" class="m faint mono">ask for a change, or /help</text>
    <text x="30" y="250" class="m muted mono">--prompt:</text><text x="116" y="250" class="m white mono">stdout = final answer</text><text x="348" y="250" class="m faint mono">stderr = runtime activity</text>
  </g>
</svg>
